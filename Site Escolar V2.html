<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Escolar L&L</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --vermelho: #e50914;
  --preto: #111;
  --branco: #fff;
  --cinza: #f0f0f0;
}
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background-color: var(--preto);
  color: var(--branco);
  transition: all 0.3s;
}
body.light {
  background-color: var(--branco);
  color: var(--preto);
}
header {
  background-color: var(--vermelho);
  padding: 20px;
  text-align: center;
  font-size: 1.5em;
  font-weight: bold;
}
header span {
  font-size: 0.6em;
  display: block;
  font-weight: normal;
}
nav {
  display: flex;
  background-color: #222;
  flex-wrap: wrap;
}
nav button {
  flex: 1;
  padding: 15px;
  border: none;
  background: #222;
  color: var(--branco);
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s;
}
nav button.active, nav button:hover {
  background: var(--vermelho);
}
.container {
  padding: 20px;
}
input, select, button {
  padding: 10px;
  margin: 5px 0;
  border-radius: 5px;
  border: none;
  font-size: 1em;
}
input, select {
  width: 100%;
}
button {
  cursor: pointer;
  background-color: var(--vermelho);
  color: var(--branco);
  transition: background 0.3s;
}
button:hover {
  background-color: #b1070f;
}
.tab {
  display: none;
}
.tab.active {
  display: block;
}
.user-list {
  margin-top: 10px;
  border-collapse: collapse;
  width: 100%;
}
.user-list th, .user-list td {
  padding: 10px;
  border: 1px solid var(--cinza);
}
canvas {
  max-width: 100%;
}
.switch-theme {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 10px;
  background: var(--vermelho);
  border: none;
  border-radius: 5px;
  color: var(--branco);
  cursor: pointer;
}
.login-container {
  max-width: 400px;
  margin: 50px auto;
  background: #222;
  padding: 20px;
  border-radius: 10px;
}
.login-container.light {
  background: var(--cinza);
  color: var(--preto);
}
.login-container h2 {
  text-align: center;
}
.animated-logo {
  font-weight: bold;
  font-size: 2em;
  text-align: center;
  margin-bottom: 10px;
  min-height: 40px;
}
.alert {
  padding: 10px;
  margin-top: 10px;
  border-radius: 5px;
}
.alert.error {
  background-color: #c00;
  color: #fff;
}
.alert.success {
  background-color: #0c0;
  color: #fff;
}

/* =================== 🔧 MELHORIAS PARA CELULAR =================== */
@media (max-width: 768px) {
  header {
    font-size: 1.2em;
    padding: 15px;
  }
  nav {
    flex-direction: column;
  }
  nav button {
    font-size: 1em;
    padding: 12px;
    border-bottom: 1px solid #333;
  }
  .container {
    padding: 15px;
  }
  input, select, button {
    font-size: 1em;
    padding: 10px;
  }
  .login-container {
    width: 90%;
    margin-top: 30px;
  }
  table {
    font-size: 0.9em;
  }
  canvas {
    width: 100% !important;
    height: auto !important;
  }
  .switch-theme {
    top: 10px;
    right: 10px;
    font-size: 0.9em;
    padding: 8px;
  }
}
</style>
</head>

<body>
<header>Sistema Escolar L&L <span>Organize, Avalie e Inspire sua turma!</span></header>
<button class="switch-theme">🌗 Tema</button>

<div id="loginTab" class="login-container">
  <div class="animated-logo" id="logoText"></div>
  <h2>Login</h2>
  <input type="text" id="loginUser" placeholder="Usuário">
  <input type="password" id="loginPass" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <div id="loginAlert"></div>
</div>

<div id="mainApp" style="display:none;">
  <nav>
    <button class="tabBtn active" onclick="showTab(0)">Administração</button>
    <button class="tabBtn" onclick="showTab(1)">Configurar Turma</button>
    <button class="tabBtn" onclick="showTab(2)">Cadastro Alunos</button>
    <button class="tabBtn" onclick="showTab(3)">Resultados</button>
  </nav>

  <!-- Administração -->
  <div class="container tab active">
    <h3>Gerenciamento de Usuários</h3>
    <input type="text" id="newUser" placeholder="Nome de usuário">
    <input type="password" id="newPass" placeholder="Senha">
    <select id="newRole">
      <option value="user">Usuário</option>
      <option value="admin">Administrador</option>
    </select>
    <button onclick="createUser()">Criar Usuário</button>
    <table class="user-list" id="userTable">
      <thead>
        <tr><th>Usuário</th><th>Função</th><th>Ações</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Configurar Turma -->
  <div class="container tab">
    <h3>Configuração da Turma</h3>
    <input type="number" id="qtdAlunos" placeholder="Quantidade de Alunos">
    <input type="number" id="qtdNotas" placeholder="Quantidade de Notas por aluno">
    <button onclick="nextTab(2)">Avançar</button>
  </div>

  <!-- Cadastro Alunos -->
  <div class="container tab">
    <h3>Cadastro de Alunos</h3>
    <div id="alunoInputs"></div>
    <button onclick="calcularResultados()">Calcular Resultados</button>
  </div>

  <!-- Resultados -->
  <div class="container tab">
    <h3>Resultados da Turma</h3>
    <div id="resultados"></div>
    <canvas id="chartMedia"></canvas>
    <canvas id="chartAprov"></canvas>
    <button onclick="exportPDF()">Exportar PDF</button>
    <button onclick="exportExcel()">Exportar Excel</button>
  </div>
</div>

<script>
/* =================== Tema =================== */
const themeBtn = document.querySelector('.switch-theme');
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('light');
  document.querySelector('#loginTab')?.classList.toggle('light');
});

/* =================== Logo Animado =================== */
const logo = document.getElementById('logoText');
const logoStr = "Sistema Escolar L&L";
let logoIndex = 0;
function typeLogo() {
  if(logoIndex < logoStr.length){
    logo.innerHTML += logoStr[logoIndex];
    logoIndex++;
    setTimeout(typeLogo, 100);
  }
}
typeLogo();

/* =================== Usuários =================== */
let users = [
  {username:"Lucas.Ribeiro", password:btoa("anajuh"), role:"admin"}
];

function renderUsers(){
  const tbody = document.querySelector("#userTable tbody");
  tbody.innerHTML = "";
  users.forEach((u,i)=>{
    tbody.innerHTML += `<tr>
      <td>${u.username}</td>
      <td>${u.role}</td>
      <td>
        ${u.role !== 'admin' ? `<button onclick="promoteUser(${i})">Promover</button>` : `<button onclick="demoteUser(${i})">Despromover</button>`}
        <button onclick="deleteUser(${i})">Excluir</button>
      </td>
    </tr>`;
  });
}
function createUser(){
  const name = document.getElementById("newUser").value;
  const pass = document.getElementById("newPass").value;
  const role = document.getElementById("newRole").value;
  if(name && pass){
    users.push({username:name,password:btoa(pass),role:role});
    renderUsers();
    document.getElementById("newUser").value="";
    document.getElementById("newPass").value="";
  }
}
function promoteUser(i){users[i].role="admin";renderUsers();}
function demoteUser(i){users[i].role="user";renderUsers();}
function deleteUser(i){users.splice(i,1);renderUsers();}

/* =================== Login =================== */
function login(){
  const user = document.getElementById("loginUser").value;
  const pass = document.getElementById("loginPass").value;
  const found = users.find(u=>u.username===user && u.password===btoa(pass));
  const alertDiv = document.getElementById("loginAlert");
  if(found){
    alertDiv.innerHTML = "";
    document.getElementById("loginTab").style.display="none";
    document.getElementById("mainApp").style.display="block";
    renderUsers();
  }else{
    alertDiv.innerHTML = "<div class='alert error'>Usuário ou senha incorretos!</div>";
  }
}

/* =================== Abas =================== */
const tabs = document.querySelectorAll('.tab');
const tabBtns = document.querySelectorAll('.tabBtn');
function showTab(index){
  tabs.forEach((t,i)=>t.classList.remove('active'));
  tabs[index].classList.add('active');
  tabBtns.forEach((b,i)=>b.classList.remove('active'));
  tabBtns[index].classList.add('active');
}
function nextTab(index){showTab(index);}

/* =================== Cadastro Alunos =================== */
let qtdAlunos = 0, qtdNotas = 0, alunos = [];
function nextTab(index){
  if(index===2){
    qtdAlunos = parseInt(document.getElementById("qtdAlunos").value);
    qtdNotas = parseInt(document.getElementById("qtdNotas").value);
    if(isNaN(qtdAlunos)||isNaN(qtdNotas)||qtdAlunos<=0||qtdNotas<=0){alert("Insira valores válidos");return;}
    const div = document.getElementById("alunoInputs");
    div.innerHTML = "";
    alunos = [];
    for(let i=0;i<qtdAlunos;i++){
      let html = `<div><h4>Aluno ${i+1}</h4>
        <input type="text" placeholder="Nome" id="nome${i}">`;
      for(let j=0;j<qtdNotas;j++){
        html += `<input type="number" placeholder="Nota ${j+1}" id="nota${i}_${j}" step="0.01">`;
      }
      html += `</div>`;
      div.innerHTML += html;
    }
  }
  showTab(index);
}

/* =================== Resultados =================== */
function calcularResultados(){
  alunos = [];
  let maiorNota = -1;
  let nomesMaiorNota = [];
  let somaMedias = 0;
  for(let i=0;i<qtdAlunos;i++){
    const nome = document.getElementById(`nome${i}`).value;
    const notas = [];
    let somaAluno=0;
    for(let j=0;j<qtdNotas;j++){
      const val = parseFloat(document.getElementById(`nota${i}_${j}`).value)||0;
      notas.push(val);
      somaAluno+=val;
      if(val>maiorNota){maiorNota=val;nomesMaiorNota=[nome];}
      else if(val===maiorNota){nomesMaiorNota.push(nome);}
    }
    const media = somaAluno/qtdNotas;
    somaMedias+=media;
    alunos.push({nome,notas,media});
  }
  const mediaTurma = somaMedias/qtdAlunos;
  let html = `<p><strong>Maior Nota:</strong> ${maiorNota}</p>`;
  html += `<p><strong>Alunos com maior nota:</strong> ${nomesMaiorNota.join(", ")}</p>`;
  html += `<p><strong>Média Geral da Turma:</strong> ${mediaTurma.toFixed(2)}</p>`;
  html += `<table border="1" cellpadding="5"><tr><th>Aluno</th><th>Média</th><th>Status</th></tr>`;
  alunos.forEach(a=>{
    html+=`<tr><td>${a.nome}</td><td>${a.media.toFixed(2)}</td><td>${a.media>=6?"Aprovado 🎉":"Reprovado 😔"}</td></tr>`;
  });
  html+="</table>";
  document.getElementById("resultados").innerHTML = html;
  showTab(3);
  renderCharts();
}

/* =================== Gráficos =================== */
let chartMedia, chartAprov;
function renderCharts(){
  const ctx = document.getElementById("chartMedia").getContext("2d");
  const labels = alunos.map(a=>a.nome);
  const dataMedia = alunos.map(a=>a.media.toFixed(2));
  if(chartMedia) chartMedia.destroy();
  chartMedia = new Chart(ctx,{type:'bar',data:{labels, datasets:[{label:'Média',data:dataMedia,backgroundColor:alunos.map(a=>a.media>=6?'#0c0':'#c00')}]}});

  const ctx2 = document.getElementById("chartAprov").getContext("2d");
  const aprov = alunos.filter(a=>a.media>=6).length;
  const reprov = alunos.length-aprov;
  if(chartAprov) chartAprov.destroy();
  chartAprov = new Chart(ctx2,{type:'pie',data:{labels:['Aprovados','Reprovados'],datasets:[{data:[aprov,reprov],backgroundColor:['#0c0','#c00']}]},options:{responsive:true}});
}

/* =================== Export PDF =================== */
function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text("Sistema Escolar L&L", 105, 15, null, null, "center");
  doc.setFontSize(10);
  doc.text("Organize, Avalie e Inspire sua turma!", 105, 22, null, null, "center");
  let y = 30;
  alunos.forEach(a=>{
    doc.text(`${a.nome}: Média ${a.media.toFixed(2)} - ${a.media>=6?"Aprovado":"Reprovado"}`, 15, y);
    y+=7;
  });
  doc.save("relatorio_turma.pdf");
}

/* =================== Export Excel =================== */
function exportExcel(){
  const ws = XLSX.utils.json_to_sheet(alunos.map(a=>({Aluno:a.nome,Media:a.media.toFixed(2),Status:a.media>=6?"Aprovado":"Reprovado"})));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Turma");
  XLSX.writeFile(wb,"relatorio_turma.xlsx");
}
</script>
</body>
</html>
